name: teafield_capture
description: Tea Leaf Field Capture App for research data collection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  device_info_plus: ^11.1.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  archive: ^4.0.2
  file_picker: ^8.1.6
  share_plus: ^10.1.3
  csv: ^6.0.0
  google_sign_in: ^7.1.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.19.0
  package_info_plus: ^8.1.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
